<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DROID Scene Asset Review</title>
<style>
:root { --bg:#f3f4f6; --panel:#fff; --line:#d6dae2; --text:#111827; --muted:#667085; --blue:#2f80ed; --orange:#f59e0b; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:var(--bg); }
header { height:62px; background:#111827; color:white; display:grid; grid-template-columns: 1fr auto 1fr; align-items:center; gap:10px; padding:8px 14px; }
h1 { margin:0; font-size:16px; }
.header-left { min-width:0; }
.header-left .sub { color:#cbd5e1; font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:560px; }
.nav { display:flex; align-items:center; gap:8px; }
.header-actions { justify-self:end; display:flex; gap:8px; }
button { border:1px solid #b8c0cc; background:white; border-radius:6px; padding:7px 10px; cursor:pointer; font-size:13px; }
button.primary { background:#2563eb; border-color:#2563eb; color:white; }
button:disabled { opacity:.45; cursor:not-allowed; }
.page-indicator { min-width:92px; text-align:center; color:#f8fafc; font-size:14px; font-weight:650; }
main { height:calc(100vh - 62px); display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:10px; }
.left { min-height:0; display:grid; grid-template-rows: 1fr 0.72fr; gap:10px; }
.panel { background:white; border:1px solid var(--line); border-radius:8px; min-height:0; overflow:hidden; }
.scene-panel { display:flex; flex-direction:column; min-height:0; }
.scene-toolbar { padding:8px 10px; border-bottom:1px solid var(--line); background:#fafafa; display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:13px; }
.scene-toolbar label { display:inline-flex; align-items:center; gap:6px; }
.scene-toolbar input[type="range"] { width:120px; }
.scene-wrap { position:relative; flex:1; min-height:0; background:#0b0f17; overflow:auto; display:flex; align-items:center; justify-content:center; padding:10px; }
.scene-inner { position:relative; width:min(100%, 1280px); }
.scene-inner img { width:100%; display:block; user-select:none; }
.bbox { position:absolute; border:2px solid rgba(47,128,237,.96); background:rgba(47,128,237,.16); border-radius:6px; cursor:pointer; }
.bbox.active { border-color:rgba(245,158,11,.98); background:rgba(245,158,11,.22); box-shadow:0 0 0 3px rgba(245,158,11,.35); }
.bbox.dimmed { opacity:.38; }
.bbox-label { position:absolute; left:4px; top:4px; max-width:calc(100% - 8px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:white; background:rgba(47,128,237,.95); font-size:12px; font-weight:700; padding:2px 6px; border-radius:5px; pointer-events:none; }
.bbox.active .bbox-label { background:rgba(245,158,11,.98); }
.video-panel { display:flex; flex-direction:column; min-height:0; }
.video-panel h2 { margin:0; padding:8px 10px; font-size:14px; border-bottom:1px solid var(--line); background:#fafafa; display:flex; justify-content:space-between; align-items:center; }
.video-wrap { flex:1; min-height:0; background:#0b0f17; display:flex; align-items:center; justify-content:center; padding:8px; }
.video-wrap video { width:100%; height:100%; max-height:100%; object-fit:contain; background:#000; }
.right { display:grid; grid-template-rows: 1fr 1fr; gap:10px; min-height:0; }
.list-panel { display:flex; flex-direction:column; }
.list-panel h2 { margin:0; padding:10px 12px; font-size:15px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
.item-grid { padding:10px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:10px; align-content:start; }
.asset-card { border:1px solid var(--line); border-radius:8px; background:#f8fbff; padding:8px; display:grid; grid-template-rows:98px auto; gap:7px; cursor:pointer; }
.asset-card.active { outline:3px solid #f59e0b; background:#fff7ed; }
.asset-img { background:#eef2f7; border:1px solid #d7dce4; border-radius:6px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.asset-img img { max-width:100%; max-height:100%; object-fit:contain; }
.asset-name { font-size:13px; line-height:1.3; font-weight:650; }
.asset-id { font-size:10px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere; }
.details { overflow:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
.detail-header { border:1px solid var(--line); border-radius:8px; background:#fff7ed; padding:10px; }
.detail-header h3 { margin:0; font-size:15px; }
.impl-list { display:flex; flex-direction:column; gap:8px; }
.impl-item { border:1px solid var(--line); border-radius:8px; padding:8px; background:#fff; display:flex; gap:8px; align-items:flex-start; }
.impl-item input { margin-top:3px; }
.impl-name { font-size:14px; font-weight:650; }
.empty { color:var(--muted); font-size:13px; padding:10px; }
.toast { position:fixed; right:14px; bottom:14px; background:#111827; color:white; padding:9px 11px; border-radius:7px; font-size:13px; opacity:0; transition:.2s; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <div class="header-left"><h1 id="sceneTitle">DROID Scene Asset Review</h1><div class="sub" id="sceneTask"></div></div>
  <div class="nav"><button id="prevBtn" onclick="prevScene()">Prev</button><div class="page-indicator" id="pageIndicator">01 / 10</div><button id="nextBtn" onclick="nextScene()">Next</button></div>
  <div class="header-actions"><button onclick="reloadState()">Reload</button></div>
</header>
<main>
  <section class="left">
    <div class="panel scene-panel">
      <div class="scene-toolbar">
        <label><input type="checkbox" id="showLabels" checked onchange="renderScene()"> labels</label>
        <label>opacity <input type="range" id="opacitySlider" min="0.08" max="0.70" step="0.01" value="0.18" oninput="renderScene()"></label>
        <span id="activeName">selected: none</span>
      </div>
      <div class="scene-wrap"><div class="scene-inner" id="sceneInner"><img id="mainImage" src="" /></div></div>
    </div>
    <div class="panel video-panel">
      <h2>Sample Video <span id="videoName"></span></h2>
      <div class="video-wrap"><video id="sampleVideo" src="" controls preload="metadata"></video></div>
    </div>
  </section>
  <section class="right">
    <div class="panel list-panel"><h2>bbox asset 영역 <span id="needCount"></span></h2><div class="item-grid" id="assetList"></div></div>
    <div class="panel list-panel"><h2>선택 bbox 안에서 구현해야 할 것 <span id="detailCount"></span></h2><div class="details" id="detailPane"></div></div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
let state;
let sceneIndex = 0;
let activeId = null;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500);}
async function reloadState(){ const r=await fetch('review_state.json?ts='+Date.now()); state=await r.json(); normalize(); render(); }
function normalize(){
  state.scenes ||= [];
  const idx = state.scenes.findIndex(s=>s.id===state.active_scene_id);
  sceneIndex = idx >= 0 ? idx : 0;
  const s = scene();
  activeId = s?.assets?.[0]?.id || null;
  for(const sc of state.scenes){
    sc.assets ||= [];
    sc.bbox_implementation_details ||= {};
    for(const [id, d] of Object.entries(sc.bbox_implementation_details)){
      d.items ||= [];
      for(const item of d.items){ if(item.checked===undefined) item.checked=true; }
    }
  }
}
function scene(){ return state.scenes[sceneIndex]; }
function setScene(i){
  if(!state?.scenes?.length) return;
  sceneIndex=Math.max(0,Math.min(state.scenes.length-1,i));
  state.active_scene_id=scene().id;
  activeId=scene().assets?.[0]?.id || null;
  render();
}
function prevScene(){ setScene(sceneIndex-1); }
function nextScene(){ setScene(sceneIndex+1); }
function setActive(id){ activeId=id; render(); }
function activeAsset(){ return scene()?.assets?.find(a=>a.id===activeId); }
function detail(){ return scene()?.bbox_implementation_details?.[activeId] || null; }
function clearScene(){ document.getElementById('sceneInner').querySelectorAll('.bbox').forEach(e=>e.remove()); }
function render(){ renderHeader(); renderSceneMedia(); renderScene(); renderAssets(); renderDetails(); }
function renderHeader(){
  const s=scene(); if(!s) return;
  document.getElementById('sceneTitle').textContent=s.title;
  document.getElementById('sceneTask').textContent=s.task || '';
  document.getElementById('pageIndicator').textContent=String(sceneIndex+1).padStart(2,'0')+' / '+String(state.scenes.length).padStart(2,'0');
  document.getElementById('prevBtn').disabled=sceneIndex===0;
  document.getElementById('nextBtn').disabled=sceneIndex===state.scenes.length-1;
}
function renderSceneMedia(){
  const s=scene(); if(!s) return;
  const img=document.getElementById('mainImage'); if(img.getAttribute('src')!==s.image) img.setAttribute('src',s.image);
  const v=document.getElementById('sampleVideo'); if(v.getAttribute('src')!==s.video){ v.setAttribute('src',s.video); v.load(); }
  document.getElementById('videoName').textContent='sample_video_ext1.mp4';
}
function renderScene(){
  clearScene();
  const s=scene(); if(!s) return;
  const inner=document.getElementById('sceneInner');
  const showLabels=document.getElementById('showLabels')?.checked ?? true;
  const opacity=Number(document.getElementById('opacitySlider')?.value ?? 0.18);
  const active=activeAsset();
  document.getElementById('activeName').textContent = active ? 'selected: '+active.name : 'selected: none';
  for(const asset of s.assets){
    if(asset.visible===false || !asset.overlay) continue;
    const o=asset.overlay;
    const el=document.createElement('div');
    el.className='bbox '+(asset.id===activeId?'active ':'')+(activeId&&asset.id!==activeId?'dimmed ':'');
    el.style.left=o.x+'%'; el.style.top=o.y+'%'; el.style.width=o.w+'%'; el.style.height=o.h+'%';
    el.style.backgroundColor=`rgba(47,128,237,${opacity})`;
    el.onclick=e=>{e.stopPropagation(); setActive(asset.id);};
    if(showLabels){ const lab=document.createElement('div'); lab.className='bbox-label'; lab.textContent=asset.name; el.appendChild(lab); }
    inner.appendChild(el);
  }
}
function renderAssets(){
  const s=scene();
  document.getElementById('needCount').textContent='('+(s?.assets?.length||0)+')';
  document.getElementById('assetList').innerHTML = (s?.assets||[]).map(assetCard).join('');
}
function assetCard(asset){
  const img = asset.bbox_crop_png ? `<img src="${esc(asset.bbox_crop_png)}">` : '';
  return `<div class="asset-card ${asset.id===activeId?'active':''}" onclick="setActive('${esc(asset.id)}')"><div class="asset-img">${img}</div><div><div class="asset-name">${esc(asset.name)}</div><div class="asset-id">${esc(asset.id)}</div></div></div>`;
}
function renderDetails(){
  const d=detail(); const pane=document.getElementById('detailPane');
  if(!d){ pane.innerHTML='<div class="empty">선택된 bbox detail 없음</div>'; document.getElementById('detailCount').textContent='(0)'; return; }
  document.getElementById('detailCount').textContent='('+d.items.length+')';
  pane.innerHTML=`<div class="detail-header"><h3>${esc(d.title)}</h3></div><div class="impl-list">${d.items.map(implItem).join('')}</div>`;
}
function implItem(item, idx){ return `<label class="impl-item"><input type="checkbox" ${item.checked?'checked':''} onchange="toggleImpl(${idx}, this.checked)"><div class="impl-name">${esc(item.name)}</div></label>`; }
function toggleImpl(idx, checked){ const d=detail(); if(d&&d.items[idx]) d.items[idx].checked=checked; }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') prevScene();
  if(e.key==='ArrowRight') nextScene();
});
reloadState().catch(e=>{console.error(e);toast('load failed');});
</script>
</body>
</html>
